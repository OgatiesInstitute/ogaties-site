<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOSHIAKI OGATA</title>
    <!-- Aviano/BVLGARI同系統のクラシック・ローマン体（Cinzel） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }
        .container {
            max-width: 620px;
            width: 100%;
        }
        /* PC・タブレット用の基本設定 */
        h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.1rem;
            font-weight: 400;
            font-style: normal;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            margin-bottom: 0.8rem;
            color: #ffffff;
            text-indent: 0.28em;
        }

        /* スマホ画面（幅480px以下）のときだけ1行に収める設定 */
        @media (max-width: 480px) {
            h1 {
                font-size: 1.35rem;     /* 文字サイズを調整 */
                letter-spacing: 0.16em; /* 字間を調整 */
                text-indent: 0.16em;
            }
        }
        p.subtitle {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #888888;
            margin-bottom: 2.2rem;
            font-weight: 300;
            font-style: italic;
        }
        .section {
            margin-bottom: 1.0rem; /* スペースを最小限に縮小 */
        }
        .label {
            font-size: 0.75rem;
            color: #666666;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 0.2rem;
            display: block;
            font-style: italic;
        }
        a {
            color: #ffffff;
            text-decoration: none;
            border-bottom: 1px solid #333333;
            transition: border-color 0.2s ease, color 0.2s ease;
            font-style: italic;
            font-size: 0.9rem;
            display: inline-block;
        }
        a:hover {
            color: #cccccc;
            border-bottom-color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TOSHIAKI OGATA</h1>
        <p class="subtitle">Ogaties Institute</p>
        
        <div class="section">
            <span class="label">Professional Dossier</span>
            <a href="https://www.linkedin.com/in/ogaties/" target="_blank" rel="noopener noreferrer">LinkedIn Profile</a>
        </div>

        <div class="section">
            <span class="label">Data / Publications</span>
            <a href="https://www.amazon.com/stores/author/B0GZX3ZDRX/about" target="_blank" rel="noopener noreferrer">Amazon Author Biography</a>
        </div>
    </div>
</body>
</html>

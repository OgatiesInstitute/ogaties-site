<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOSHIAKI OGATA</title>
    <!-- Aviano/BVLGARI同系統のクラシック・ローマン体（Cinzel） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-style: italic;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }
        .container {
            max-width: 620px;
            width: 100%;
        }
        /* BVLGARI調：全大文字 ＋ 広い字間 ＋ 直立ローマン体 */
        h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.1rem;
            font-weight: 400;
            font-style: normal;
            letter-spacing: 0.28em; /* 高級感を最大化する字間 */
            text-transform: uppercase; /* 確実に全大文字化 */
            margin-bottom: 0.8rem;
            color: #ffffff;
            text-indent: 0.28em; /* 中央配置の視覚的バランス補線 */
        }
        p.subtitle {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #888888;
            margin-bottom: 2.8rem; /* Space */
            font-weight: 300;
            font-style: italic;
        }
        /* コンテンツエリア：コンパクト配置 */
        .section {
            margin-bottom: 1.2rem;
        }
        .label {
            font-size: 0.75rem;
            color: #666666;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 0.2rem;
            display: block;
            font-style: italic;
        }
        ul.link-list {
            list-style: none;
        }
        ul.link-list li {
            margin-bottom: 0.38rem;
            font-size: 0.85rem;
            font-style: italic;
        }
        a {
            color: #ffffff;
            text-decoration: none;
            border-bottom: 1px solid #333333;
            transition: border-color 0.2s ease, color 0.2s ease;
            font-style: italic;
        }
        a:hover {
            color: #cccccc;
            border-bottom-color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TOSHIAKI OGATA</h1>
        <p class="subtitle">Independent research in Optimal Transport, High-Frequency Trading, and AI/ML.</p>
        
        <div class="section">
            <span class="label">Research / Models</span>
            <ul class="link-list">
                <li><a href="https://ogatiesinstitute.github.io/2026-daily-3d-structure/" target="_blank" rel="noopener">Interactive 3D Structure Analysis</a></li>
            </ul>
        </div>

        <div class="section">
            <span class="label">Professional Dossier</span>
            <ul class="link-list">
                <li><a href="https://www.linkedin.com/in/ogaties/" target="_blank" rel="noopener">LinkedIn Profile</a></li>
            </ul>
        </div>

        <div class="section">
            <span class="label">Data / Publications</span>
            <ul class="link-list">
                <li><a href="https://zenodo.org/records/20837647" target="_blank" rel="noopener">CERN Zenodo #20837647</a></li>
                <li><a href="https://zenodo.org/records/20966791" target="_blank" rel="noopener">CERN Zenodo #20966791</a></li>
                <li><a href="https://www.amazon.com/stores/author/B0GZX3ZDRX/about" target="_blank" rel="noopener">Amazon Author Biography</a></li>
            </ul>
        </div>
    </div>
</body>
</html>
